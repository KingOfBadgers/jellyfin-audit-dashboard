version: '3.8'

services:
  jellyfin-audit:
    image: jellyfin-audit:latest
    build:
      context: .
      args:
        NEXT_PUBLIC_JELLYFIN_URL: http://192.168.0.52:8096
    container_name: jellyfin-audit-app
    # Fixes the EACCES volume permission issue dynamically for standard users
    user: "1000:1000"  
    restart: unless-stopped
    ports:
      - "8098:8098"
    environment:
      - NODE_ENV=production
      - JELLYFIN_URL=${JELLYFIN_URL}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - JELLYFIN_USER_ID=${JELLYFIN_USER_ID}
    volumes:
      - jellyfin_audit_data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  jellyfin_audit_data: