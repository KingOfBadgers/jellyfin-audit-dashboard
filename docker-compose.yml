version: '3.8'

services:
  jellyfin-audit:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: jellyfin-audit-app
    restart: unless-stopped
    ports:
      - "8098:8098"
    environment:
      - NODE_ENV=production
    volumes:
      - jellyfin_audit_data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  jellyfin_audit_data:
  
      